# Configuração do gitleaks (workflow Segurança). Usa as regras padrão e ignora só:
#  - pastas test/ (fixtures com tokens falsos, como "EAAtokenfalso..." e "tok-webhook-asaas")
#  - arquivos .env.exemplo / .env.example (valores de exemplo, sem segredo)
# Segredo de verdade em qualquer outro lugar, inclusive no histórico, faz o job falhar.
[extend]
useDefault = true

[allowlist]
description = "Fixtures de teste e exemplos de configuração"
paths = [
  '''(^|/)test/''',
  '''(^|/)\.env\.ex(emplo|ample)$''',
]
# Falsos positivos conferidos um a um (o valor inteiro do "segredo" tem de bater):
#  - "perfillinkedin": apelido de coluna na importação de currículos (rh/src/recrutamento/importacao.js),
#    que a regra linkedin-client-id lê como um client id de 14 caracteres
regexes = [
  '''^perfillinkedin$''',
]
