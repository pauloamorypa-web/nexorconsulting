# Publicação do Nexor Assist no Render (https://render.com) → New + → Blueprint → este repositório
services:
  - type: web
    name: nexor-assist
    runtime: node
    rootDir: agent
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEXOR_MODEL
        value: claude-opus-5-5
      - key: NEXOR_EFFORT
        value: low
      - key: ALLOWED_ORIGINS
        value: https://nexorconsultingit.com.br,https://www.nexorconsultingit.com.br,https://pauloamorypa-web.github.io
      - key: REPORT_TOKEN
        generateValue: true
      - key: META_PIXEL_ID
        sync: false
      - key: META_CAPI_TOKEN
        sync: false
      - key: LEAD_WEBHOOK_URL
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: TEAM_WHATSAPP
        value: "5534997337499"

  # Nexor Atende IA: painel + webhook da WhatsApp Cloud API (pasta atende/)
  - type: web
    name: nexor-atende-ia
    runtime: node
    rootDir: atende
    plan: starter # o disco persistente exige um plano pago
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEXOR_MODEL
        value: claude-opus-5-5
      - key: NEXOR_EFFORT
        value: low
      - key: PUBLIC_URL
        sync: false
      - key: MASTER_KEY
        generateValue: true
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        generateValue: true
      - key: META_APP_ID
        sync: false
      - key: META_CONFIG_ID
        sync: false
      - key: ALLOW_SIGNUP
        value: "false"

  # Nexor RH: painel do RH, app do trabalhador, quiosque de ponto e eSocial (pasta rh/)
  - type: web
    name: nexor-rh
    runtime: node
    rootDir: rh
    plan: starter # o disco persistente exige um plano pago
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: dados-rh
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_URL
        sync: false
      - key: MASTER_KEY
        generateValue: true
      - key: ALLOW_SIGNUP
        value: "false"
      - key: DEVELOPER_CNPJ
        sync: false
