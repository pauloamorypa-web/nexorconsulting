# Borda da Nuvem Nexor: um Caddy só, que recebe todos os endereços *.nexorconsultingit.com.br
# (e os domínios próprios dos clientes hospedados) e entrega cada um ao sistema certo.
# Não abre porta nenhuma. HTTPS na Cloudflare. Rotas em sites/*.caddy, criadas pelo subdominio.sh.
# Dois jeitos de rodar (o instalar.sh escolhe sozinho):
#   - VPS única: o túnel do servidor interno (interno/) chega aqui pela rede "nexor-borda";
#   - VPS separadas (recomendado com mais de 10 clientes): esta VPS só tem clientes e usa o túnel
#     próprio abaixo (perfil "tunel", token em nuvem/.env).
name: nexor-borda

services:
  borda:
    image: caddy:2
    restart: unless-stopped
    networks:
      borda:
        aliases: [borda]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "./sites:/etc/caddy/sites:ro", "caddy-dados:/data"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  tunel:
    image: cloudflare/cloudflared:latest
    profiles: [tunel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment: { TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}" }
    networks: [borda]
    depends_on: [borda]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

networks:
  borda:
    external: true
    name: nexor-borda

volumes:
  caddy-dados: {}
